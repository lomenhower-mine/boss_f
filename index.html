/* post-processing: MSAA + bloom + ACES + chromatic aberration + vignette + grain */
const FX={uniforms:{tDiffuse:{value:null},t:{value:0},ab:{value:.0016}},vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform sampler2D tDiffuse;uniform float t,ab;varying vec2 v;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+t)*43758.5453);}vec3 aces(vec3 c){c*=1.3;return clamp((c*(2.51*c+.03))/(c*(2.43*c+.59)+.14),0.,1.);}void main(){vec2 d=v-.5;float r=dot(d,d);vec2 o=d*r*ab*8.;vec3 c=vec3(texture2D(tDiffuse,v+o).r,texture2D(tDiffuse,v).g,texture2D(tDiffuse,v-o).b);c=aces(c);c*=1.-r*1.1;c+=(h(v)-.5)*.03;gl_FragColor=vec4(c,1.);}'};

comp=new THREE.EffectComposer(rd,rt);comp.addPass(new THREE.RenderPass(sc,cam));comp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.1,.75,.85));FXP=new THREE.ShaderPass(FX);comp.addPass(FXP);comp.setSize(innerWidth,innerHeight)}
